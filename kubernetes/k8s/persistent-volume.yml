apiVersion: v1

kind: PersistentVolume

metadata:
  name: pv-taskflow
  labels:
    app: postgres

spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  storageClassName: manual # standard for automaticallyy creating pv , use in pvc
  hostPath:
    path: /mnt/data/postgres
  