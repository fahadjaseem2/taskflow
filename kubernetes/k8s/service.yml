apiVersion: v1
kind: Service
metadata:
  name: postgres-service-taskflow
  namespace: taskflow
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432

---

apiVersion: v1
kind: Service
metadata:
  name: redis-service-taskflow
  namespace: taskflow
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379

---

apiVersion: v1
kind: Service
metadata:
  name: backend-service-taskflow
  namespace: taskflow
spec:
  selector:
    app: backend
  ports:
    - port: 4000
      targetPort: 4000

---

apiVersion: v1
kind: Service
metadata:
  name: frontend-service-taskflow
  namespace: taskflow
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
