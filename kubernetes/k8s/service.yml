apiVersion: v1
kind: Service
metadata:
  name: postgres-service-taskflow
  namespace: taskflow
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432

---

apiVersion: v1
kind: Service
metadata:
  name: redis-service-taskflow
  namespace: taskflow
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379

---

apiVersion: v1
kind: Service
metadata:
  name: backend-service-taskflow
  namespace: taskflow
spec:
  selector:
    app: backend
  ports:
    - port: 4000
      targetPort: 4000
