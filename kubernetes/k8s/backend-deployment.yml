apiVersion: apps/v1
kind: Deployment

metadata:
  name: taskflow-backend-deployment
  namespace: taskflow
  labels:
    app: backend

spec:
  replicas: 2

  strategy:
    type: RollingUpdate

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - "until nc -z postgres-service-taskflow 5432; do sleep 2; done" # nc = netcat, -z = dont give output

      containers:
        - name: taskflow
          image: fahadjaseem/taskflow-backend:latest

          ports:
            - containerPort: 4000

          envFrom:
            - configMapRef:
                name: taskflow-configmap
            - secretRef:
                name: taskflow-secrets

          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"

          livenessProbe:
            httpGet:
              path: /healthz
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /healthz
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3