apiVersion: v1

kind: ConfigMap

metadata:
  name: taskflow-configmap
  namespace: taskflow

data:
  POSTGRES_USER: taskflow                   # Database user
  POSTGRES_DB: taskflow                     # Database name
  POSTGRES_HOST: postgres-service-taskflow  # PostgreSQL k8s Service
  POSTGRES_PORT: "5432"                     # PostgreSQL port

  REDIS_HOST: redis-service-taskflow                 # due to k8s service and in docker it should be service name
  REDIS_PORT: "6379"

  DB_HOST: postgres-service-taskflow
  DB_PORT: "5432"
  DB_USER: taskflow
  DB_NAME: taskflow