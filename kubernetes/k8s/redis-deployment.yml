apiVersion: apps/v1
kind: Deployment

metadata:
  name: taskflow-redis-deployment
  namespace: taskflow
  labels:
    app: redis

spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: redis

  template:
    metadata:
      labels:
        app: redis

    spec:
      containers:
        - name: taskflow
          image: redis:8-alpine

          ports:
            - containerPort: 6379

          volumeMounts:
            - mountPath: /data
              name: redis-storage

          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - |
                  response=$(redis-cli ping | head -n 1)
                  if [ "$response" = "PONG" ] || [ "$response" = "LOADING" ]; then
                    exit 0
                  else
                    exit 1
                  fi              
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            exec:
              command:
               -  sh
               -  -c
               -  "redis-cli ping| grep -q PONG"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2

      volumes:
        - name: redis-storage
          persistentVolumeClaim:
            claimName: pvc-redis-taskflow