services:
  postgres:
    image: postgres:18-alpine
    container_name: taskflow-db
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - taskflow-vol:/var/lib/postgresql
    networks:
      - taskflow
    expose:
      - "${DB_PORT}"
    restart: always
    healthcheck:
      # inside the PostgreSQL container, check whether the DB_USER can connect to the DB_NAME database.
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:8-alpine
    container_name: taskflow-redis
    volumes:
      - redis-vol:/data
    networks:
      -  taskflow
    expose: 
      - "${REDIS_PORT}"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    
      
  backend:
    build:
      context: ./backend
    image: fahadjaseem/taskflow-backend:${IMAGE_TAG:-latest} # Use IMAGE_TAG if it exists and is not empty; otherwise use latest.
    container_name: taskflow-backend
    environment:
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}

      DB_HOST: postgres
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    networks:
      - taskflow
    expose:
      - ${BACKEND_PORT}
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:${BACKEND_PORT}/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    
  frontend:
    build:
      context: ./frontend
    image: fahadjaseem/taskflow-frontend:${IMAGE_TAG:-latest}
    networks:
      - taskflow
    ports:
      - "${FRONTEND_PORT}:8080"
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      
