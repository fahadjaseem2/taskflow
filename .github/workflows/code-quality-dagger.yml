name: code scan by dagger

on:
  push:
    branches:
      - feat/github-actions

jobs:
  dagger-sacn:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4
      
      - name: Setup dagger
        uses: dagger/dagger-for-github@v8
        with:
          version: "latest"

      - name: Run CI with dagger
        run: dagger call ci
      