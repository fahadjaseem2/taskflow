name: taskflow ci pipeline

on:
  push:
    branches:
      - feat/github-actions

permissions:
  contents: read
  security-events: write

jobs:
  code-quality:
    uses: ./.github/workflows/code-quality.yml

  dependency-security:
    uses: ./.github/workflows/dependency-security.yml

  secrets-scaning:
    uses: ./.github/workflows/secrets-scan.yml

  docker-scan:
    uses: ./.github/workflows/docker-scan.yml

  # Sonarqube-scan:
  #   uses: ./.github/workflows/sonarqube-scan.yml
  #   secrets: inherit

  docker-push:
    needs:
      - code-quality
      - dependency-security
      - secrets-scaning
      - docker-scan
      #- Sonarqube-scan
    uses: ./.github/workflows/docker-push.yml
    secrets: inherit

############################################################
#                         DEPLOY                           #
############################################################    

  deploy:
    needs:
      - docker-push
    uses: ./.github/workflows/deploy.yml

  OWASP-ZAP-Scan:
    needs:
      - deploy
    uses: ./.github/workflows/owasp-zap-test.yml
    
