name: Sonar scan

on:
  workflow_call:

jobs:
  sonarqube-frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: clean Install
        run: npm ci
      
      - name: Build application
        run: npm run build

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        with: 
          projectBaseDir: frontend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_NEW }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}


  sonarqube-backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean install 
        run: npm ci

      - name: Build application
        run: npm run build
      
      - name: SonarQube Scan 
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        with:
          projectBaseDir: backend
        env: 
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_NEW }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}